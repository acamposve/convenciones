services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convenciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convenciones}
      POSTGRES_DB: ${POSTGRES_DB:-convenciones}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
