server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router): cualquier ruta que no sea un archivo real cae a index.html,
    # para que /documentos/5 funcione en refresh directo, no solo navegando desde /.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
