#modificado al 16/08/2026

name: CI

on:
  pull_request:
    # "main" debe existir como rama en GitHub (creada manualmente) para que esto dispare —
    # el repo arranco con "master" como default, ver docs/plan-publish-azure.md.
    branches: [main]

jobs:
  api:
    name: Build & test API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Comparador.sln agrupa Comparador.Api.csproj + Comparador.Api.Tests — con los dos
      # archivos conviviendo en api/, el auto-discovery de `dotnet` ya no alcanza
      # (MSB1011: mas de un archivo de proyecto o solucion), asi que se apunta explicito.
      - run: dotnet restore Comparador.sln
        working-directory: api
      - run: dotnet build Comparador.sln --no-restore
        working-directory: api
      - run: dotnet test Comparador.sln --no-build
        working-directory: api

  ai-service:
    name: Build & test servicio IA (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt --break-system-packages
        working-directory: service
      - run: pytest
        working-directory: service

  frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
